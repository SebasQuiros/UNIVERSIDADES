name: Daily Database Backup

# Backup REAL de la base de datos (Supabase Postgres) vía pg_dump, subido
# como artefacto de GitHub Actions. Reemplaza el workflow anterior, que
# verificaba backups en un VPS que ya no forma parte del stack real
# (el stack real es Vercel + Railway + Supabase) — daba falsa confianza de
# que había backups cuando en realidad ese chequeo siempre fallaba en silencio.
#
# Requiere el secret `DATABASE_URL` (o `SUPABASE_DB_URL`) en
# Settings → Secrets and variables → Actions — la misma cadena de conexión
# directa (no el pooler) que usa Prisma para migraciones.
#
# Los artefactos de GitHub se retienen 90 días por defecto (ver `retention-days`
# abajo). Para retención más larga o backups fuera de GitHub, considerar
# también habilitar los backups automáticos nativos de Supabase (Settings →
# Database → Backups en el dashboard del proyecto) como capa adicional —
# eso no lo puede verificar/activar este workflow, es una acción manual en
# el panel de Supabase.

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC = 2 AM Costa Rica
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump de la base de datos
        env:
          DB_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "❌ Falta el secret DATABASE_URL (o SUPABASE_DB_URL) en Settings → Secrets and variables → Actions."
            echo "   Sin esto no se puede hacer backup — configuralo con la cadena de conexión DIRECTA de Supabase (no el pooler)."
            exit 1
          fi
          DATE=$(date +%Y%m%d)
          pg_dump "$DB_URL" --no-owner --no-privileges | gzip > "backup-${DATE}.sql.gz"
          SIZE=$(stat -c %s "backup-${DATE}.sql.gz")
          if [ "$SIZE" -lt 1024 ]; then
            echo "❌ El backup salió sospechosamente pequeño (${SIZE} bytes) — probablemente falló silenciosamente."
            exit 1
          fi
          echo "✅ Backup generado: backup-${DATE}.sql.gz (${SIZE} bytes)"

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 90
